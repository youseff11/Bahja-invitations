<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>افتتاحية زفاف كلاسيكية فاخرة</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Marcellus&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --burgundy-deep: #1e0307;
      --burgundy-dark: #35060d;
      --burgundy-main: #4d0a15;
      --burgundy-light: #6a101f;
      --gold-solid: #c59b4c;
      --gold-light: #f7e7a9;
      --paper-cream: #faf7f2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      width: 100%;
      background: radial-gradient(ellipse at center, #3d0810 0%, #160205 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Amiri', serif;
      overflow-x: hidden;
      perspective: 1200px;
      -webkit-perspective: 1200px;
      padding: 15px;
    }

    /* الغطا: طبقة بتملا الشاشة كلها وكل الظرف جوّاها. الافتتاحية بتعتبرها
       «غطا الكود» وبتسيب الحركة تكمّل بدل ما تفتح الدعوة من أول ضغطة. */
    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(ellipse at center, #3d0810 0%, #160205 100%);
      perspective: 1200px;
      -webkit-perspective: 1200px;
      transition: opacity 0.6s ease, visibility 0.6s;
    }
    .stage.is-leaving { opacity: 0; visibility: hidden; }

    .bg-vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, transparent 50%, rgba(0,0,0,0.7) 100%);
      z-index: 1;
    }

    /* حاوية الظرف */
    .envelope-wrapper {
      position: relative;
      width: 88vw;
      max-width: 420px;
      height: 310px;
      margin: auto;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      z-index: 10;
    }

    /* قاعدة الظرف الخلفية */
    .envelope-base {
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, var(--burgundy-deep), #260308);
      border-radius: 8px;
      box-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.85),
        0 0 0 1px rgba(197, 155, 76, 0.45),
        inset 0 0 40px rgba(0, 0, 0, 0.8);
      cursor: pointer;
    }

    .envelope-base::after {
      content: '';
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(197, 155, 76, 0.25);
      border-radius: 5px;
      pointer-events: none;
    }

    /* أطراف الظرف المشتركة */
    .flap {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      backface-visibility: visible;
      -webkit-backface-visibility: visible;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
    }

    /* 1. الطرف العلوي */
    .flap-top {
      clip-path: polygon(0 0, 100% 0, 50% 51.5%);
      -webkit-clip-path: polygon(0 0, 100% 0, 50% 51.5%);
      background: linear-gradient(180deg, var(--burgundy-light) 0%, var(--burgundy-main) 100%);
      transform-origin: top center;
      -webkit-transform-origin: top center;
      z-index: 6;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    }

    /* 2. الطرف الأيمن */
    .flap-right {
      clip-path: polygon(100% 0, 100% 100%, 48.5% 50%);
      -webkit-clip-path: polygon(100% 0, 100% 100%, 48.5% 50%);
      background: linear-gradient(270deg, var(--burgundy-main) 0%, var(--burgundy-dark) 100%);
      transform-origin: right center;
      -webkit-transform-origin: right center;
      z-index: 4;
    }

    /* 3. الطرف الأيسر */
    .flap-left {
      clip-path: polygon(0 0, 0 100%, 51.5% 50%);
      -webkit-clip-path: polygon(0 0, 0 100%, 51.5% 50%);
      background: linear-gradient(90deg, var(--burgundy-main) 0%, var(--burgundy-dark) 100%);
      transform-origin: left center;
      -webkit-transform-origin: left center;
      z-index: 4;
    }

    /* 4. الطرف السفلي */
    .flap-bottom {
      clip-path: polygon(0 100%, 100% 100%, 50% 48.5%);
      -webkit-clip-path: polygon(0 100%, 100% 100%, 50% 48.5%);
      background: linear-gradient(0deg, var(--burgundy-deep) 0%, var(--burgundy-dark) 100%);
      transform-origin: bottom center;
      -webkit-transform-origin: bottom center;
      z-index: 5;
      filter: drop-shadow(0 -3px 8px rgba(0,0,0,0.45));
    }

    /* الختم الكلاسيكي */
    .wax-seal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fcedc7 0%, #d4a755 35%, #946d23 75%, #5a400f 100%);
      box-shadow: 
        0 12px 25px rgba(0, 0, 0, 0.75),
        inset 0 2px 4px rgba(255, 255, 255, 0.7),
        inset 0 -3px 6px rgba(0, 0, 0, 0.7),
        0 0 18px rgba(212, 167, 85, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 12;
      border: 1px solid rgba(255, 255, 255, 0.45);
      transition: transform 0.3s ease;
    }

    .wax-seal:active {
      transform: translate(-50%, -50%) scale(0.95);
    }

    .seal-inner-ring {
      position: absolute;
      inset: 6px;
      border: 1px dashed rgba(60, 40, 10, 0.45);
      border-radius: 50%;
      pointer-events: none;
    }

    .seal-monogram {
      font-family: 'Aref Ruqaa', serif;
      font-size: 26px;
      font-weight: 700;
      color: #3b2507;
      line-height: 1;
      text-shadow: 0 1px 1px rgba(255, 255, 255, 0.5), 0 -1px 1px rgba(0, 0, 0, 0.6);
      margin-top: -2px;
    }

    .seal-text {
      font-family: 'Marcellus', serif;
      font-size: 9px;
      color: #4a300a;
      letter-spacing: 2px;
      font-weight: bold;
      margin-top: 3px;
    }

    .tap-hint {
      position: absolute;
      bottom: -45px;
      width: 100%;
      text-align: center;
      color: var(--gold-light);
      font-size: 15px;
      letter-spacing: 1px;
      opacity: 0.85;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .tap-hint span {
      border-bottom: 1px solid rgba(197, 155, 76, 0.4);
      padding-bottom: 2px;
    }

    /* بطاقة الدعوة الداخلية */
    .invitation-card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      width: 94%;
      height: 94%;
      background: var(--paper-cream);
      border-radius: 8px;
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(197, 155, 76, 0.6);
      opacity: 0;
      visibility: hidden;
      z-index: 2;
      pointer-events: none;
    }

    .card-border-outer {
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(197, 155, 76, 0.5);
      border-radius: 5px;
      pointer-events: none;
    }

    .card-border-inner {
      position: absolute;
      inset: 12px;
      border: 0.5px solid rgba(197, 155, 76, 0.3);
      border-radius: 3px;
      pointer-events: none;
    }

    .corner-decor {
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: var(--gold-solid);
      border-style: solid;
      pointer-events: none;
    }
    .corner-tl { top: 15px; left: 15px; border-width: 1.5px 0 0 1.5px; }
    .corner-tr { top: 15px; right: 15px; border-width: 1.5px 1.5px 0 0; }
    .corner-bl { bottom: 15px; left: 15px; border-width: 0 0 1.5px 1.5px; }
    .corner-br { bottom: 15px; right: 15px; border-width: 0 1.5px 1.5px 0; }

    .bismillah {
      font-size: 14.5px;
      color: #634d38;
    }

    .crest-icon {
      width: 28px;
      height: 18px;
      margin: 4px auto 0;
      display: block;
      color: var(--gold-solid);
    }

    .welcome-phrase {
      font-size: 13.5px;
      color: #7b6552;
      margin-top: 3px;
    }

    .couple-title {
      font-family: 'Amiri', serif;
      font-size: 27px;
      font-weight: 700;
      color: var(--burgundy-main);
      line-height: 1.25;
    }

    .names-divider {
      color: var(--gold-solid);
      font-size: 20px;
      margin: 0 6px;
      font-family: 'Aref Ruqaa', serif;
    }

    .message {
      font-size: 13.5px;
      color: #4b3e34;
      line-height: 1.5;
      max-width: 90%;
      font-style: italic;
    }

    .details-box {
      border-top: 1px solid rgba(197, 155, 76, 0.35);
      border-bottom: 1px solid rgba(197, 155, 76, 0.35);
      padding: 7px 0;
      width: 88%;
      margin: 2px auto;
    }

    .details-date {
      font-size: 14px;
      font-weight: 700;
      color: var(--burgundy-deep);
      margin-bottom: 3px;
    }

    .details-venue {
      font-size: 13px;
      color: #5c4737;
    }

    .card-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 4px;
      z-index: 10;
    }

    .btn-classic-gold {
      background: linear-gradient(135deg, #c59b4c, #9d752c);
      color: #fff;
      border: none;
      padding: 7px 18px;
      border-radius: 4px;
      font-family: 'Amiri', serif;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-classic-outline {
      background: transparent;
      border: 1px solid var(--burgundy-light);
      color: var(--burgundy-light);
      padding: 6px 14px;
      border-radius: 4px;
      font-family: 'Amiri', serif;
      font-size: 13px;
      cursor: pointer;
    }

    /* ========================================================
       مجموعات Keyframes لضمان تشغيل الحركة خطوة بخطوة بكل وضوح
       ======================================================== */

    /* 1. اختفاء الختم مع دوران */
    @keyframes fadeSeal {
      0% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(0.2) rotate(45deg); opacity: 0; pointer-events: none; }
    }

    /* 2. فتح الطرف العلوي */
    @keyframes openFlapTop {
      0% { transform: rotateX(0deg); z-index: 6; }
      50% { z-index: 6; }
      100% { transform: rotateX(180deg); z-index: 1; }
    }

    /* 3. فتح الطرف الأيمن */
    @keyframes openFlapRight {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(180deg); }
    }

    /* 4. فتح الطرف الأيسر */
    @keyframes openFlapLeft {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(-180deg); }
    }

    /* 5. فتح الطرف السفلي */
    @keyframes openFlapBottom {
      0% { transform: rotateX(0deg); }
      100% { transform: rotateX(-180deg); }
    }

    /* 6. صعود وتكبير بطاقة الدعوة */
    @keyframes revealCard {
      0% {
        opacity: 0;
        visibility: visible;
        transform: translate(-50%, -40%) scale(0.85);
      }
      100% {
        opacity: 1;
        visibility: visible;
        transform: translate(-50%, -50%) scale(1.16);
      }
    }

    /* تطبيق الحركات عند الضغط عبر الكلاس .is-opening */
    .envelope-wrapper.is-opening .wax-seal {
      animation: fadeSeal 0.4s forwards ease-in;
    }

    .envelope-wrapper.is-opening .tap-hint {
      opacity: 0;
    }

    .envelope-wrapper.is-opening .flap-top {
      animation: openFlapTop 0.8s 0.35s forwards cubic-bezier(0.25, 1, 0.5, 1);
    }

    .envelope-wrapper.is-opening .flap-right {
      animation: openFlapRight 0.8s 0.6s forwards cubic-bezier(0.25, 1, 0.5, 1);
    }

    .envelope-wrapper.is-opening .flap-left {
      animation: openFlapLeft 0.8s 0.6s forwards cubic-bezier(0.25, 1, 0.5, 1);
    }

    .envelope-wrapper.is-opening .flap-bottom {
      animation: openFlapBottom 0.8s 0.85s forwards cubic-bezier(0.25, 1, 0.5, 1);
    }

    .envelope-wrapper.is-opening .invitation-card {
      pointer-events: auto;
      z-index: 25;
      animation: revealCard 1s 1.1s forwards cubic-bezier(0.16, 1, 0.3, 1);
    }

    @media (max-width: 380px) {
      @keyframes revealCard {
        0% { opacity: 0; visibility: visible; transform: translate(-50%, -40%) scale(0.85); }
        100% { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1.05); }
      }
      .couple-title { font-size: 23px; }
    }
  </style>
</head>
<body>

  <div class="stage" id="stage">
  <div class="bg-vignette"></div>

  <div class="envelope-wrapper" id="envelopeWrapper">
    <div class="envelope-base"></div>

    <!-- البطاقة الداخلية -->
    <div class="invitation-card" id="invitationCard">
      <div class="card-border-outer"></div>
      <div class="card-border-inner"></div>
      
      <div class="corner-decor corner-tl"></div>
      <div class="corner-decor corner-tr"></div>
      <div class="corner-decor corner-bl"></div>
      <div class="corner-decor corner-br"></div>

      <div class="card-top">
        <div class="bismillah">بِسْمِ اللَّـهِ الرَّحْمَـٰنِ الرَّحِيمِ</div>
        <svg class="crest-icon" viewBox="0 0 24 16" fill="currentColor">
          <path d="M12 0L14 4L18 2L17 7L22 8L17 11L18 16L12 13L6 16L7 11L2 8L7 7L6 2L10 4L12 0Z" opacity="0.85"/>
        </svg>
        <div class="welcome-phrase">نتشرف بدعوتكم لحضور حفل زفافنا</div>
      </div>

      <div class="names-container">
        <div class="couple-title">
          أحمد <span class="names-divider">&</span> سارة
        </div>
      </div>

      <div class="message">
        مشاركتكم تزيد أيامنا بهجة وفرحاً وسروراً
      </div>

      <div class="details-box">
        <div class="details-date">الخميس، 15 أكتوبر 2026</div>
        <div class="details-venue">فندق رويال بالاس — القاعة الكبرى</div>
      </div>

      <div class="card-buttons">
        <button class="btn-classic-gold">موقع الحفل</button>
        <button class="btn-classic-outline">إغلاق</button>
      </div>
    </div>

    <!-- الأطراف الأربعة -->
    <div class="flap flap-top"></div>
    <div class="flap flap-right"></div>
    <div class="flap flap-left"></div>
    <div class="flap flap-bottom"></div>

    <!-- الختم -->
    <div class="wax-seal" id="waxSeal">
      <div class="seal-inner-ring"></div>
      <div class="seal-monogram">آ & س</div>
      <div class="seal-text">ROYAL</div>
    </div>

    <div class="tap-hint" id="tapHint">
      <span>اضغط لفتح الدعوة</span>
    </div>
  </div>
  </div>

  <script>
    const stage = root.querySelector('#stage');
    const envelope = root.querySelector('#envelopeWrapper');
    let isOpened = false;
    let timer;

    // الدعوة تفتح: نخفي الغطا وننادي الافتتاحية
    function enterInvitation() {
      clearTimeout(timer);
      stage.classList.add('is-leaving');
      if (window.__lbIntro) window.__lbIntro.open();
    }

    function startOpening() {
      if (isOpened) return;
      isOpened = true;

      // تطبيق الكلاس المسؤول عن تسلسل الكي فريمز
      envelope.classList.add('is-opening');

      // إطلاق بريق ذهبي بعد خروج البطاقة
      setTimeout(() => {
        if (typeof confetti !== 'undefined') {
          confetti({
            particleCount: 50,
            spread: 70,
            origin: { y: 0.6 },
            colors: ['#c59b4c', '#dfba73', '#ffffff', '#f7e7a9']
          });
        }
      }, 1300);

      // لو الضيف ماضغطش على حاجة، ندخّله الدعوة بعد ما يقرأ البطاقة
      timer = setTimeout(enterInvitation, 7000);
    }

    root.querySelectorAll('.envelope-base, .flap, .wax-seal').forEach((el) => {
      el.addEventListener('click', startOpening);
    });

    root.querySelector('.btn-classic-gold').addEventListener('click', (e) => {
      e.stopPropagation();
      alert("قاعة رويال بالاس الكبرى - القاهرة");
    });

    // «إغلاق» = ادخل الدعوة
    root.querySelector('.btn-classic-outline').addEventListener('click', (e) => {
      e.stopPropagation();
      enterInvitation();
    });
  </script>
</body>
</html>
